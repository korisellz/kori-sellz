<!DOCTYPE html>
<html>
<head>
  <title>Kori Sellz Admin</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/style.css">
  <link rel="icon" type="image/jpeg" href="/kori-logo.jpeg">
</head>

<body>
  <header class="hero small-hero">
    <a class="logo brand-logo" href="/">
      <img src="/kori-logo.jpeg" alt="Kori Sellz logo">
    </a>
    <p>Admin Dashboard</p>
    <a class="track-link" href="/">Return to Store</a>
  </header>

  <main class="tracking-page">
    <div class="tracking-box">
      <h2>Admin Orders</h2>

      <input id="passwordInput" type="password" placeholder="Admin password">
      <button onclick="loadOrders()">Load Orders</button>

      <div id="ordersResult"></div>
    </div>
  </main>

  <script>
    async function loadOrders() {
      const password = document.getElementById("passwordInput").value.trim();
      const resultBox = document.getElementById("ordersResult");

      if (!password) {
        resultBox.innerHTML = "<p>Please enter your admin password.</p>";
        return;
      }

      resultBox.innerHTML = "<p>Loading orders...</p>";

      try {
        const res = await fetch(`/api/admin/orders?password=${encodeURIComponent(password)}`);
        const data = await res.json();

        if (!data.success) {
          resultBox.innerHTML = "<p>Incorrect password or unable to load orders.</p>";
          return;
        }

        if (!data.orders.length) {
          resultBox.innerHTML = "<p>No orders found yet.</p>";
          return;
        }

        resultBox.innerHTML = data.orders.map(order => `
          <div class="tracking-card">
            <h3>${order.customerName || order.customer_name || "Customer"}</h3>

            <p><strong>Order ID:</strong> ${order.id}</p>
            <p><strong>Email:</strong> ${order.customerEmail || order.customer_email || "N/A"}</p>
            <p><strong>Phone:</strong> ${order.customerPhone || order.customer_phone || "N/A"}</p>
            <p><strong>Status:</strong> ${order.status || "N/A"}</p>
            <p><strong>CJ Order ID:</strong> ${order.cjOrderId || order.cj_order_id || "N/A"}</p>
            <p><strong>Tracking:</strong> ${order.trackingNumber || order.tracking_number || "Not added yet"}</p>

            <input 
              id="tracking-${order.id}" 
              placeholder="Enter tracking number"
              value="${order.trackingNumber || order.tracking_number || ""}"
            >

            <input 
              id="tracking-url-${order.id}" 
              placeholder="Tracking URL optional"
              value="${order.trackingUrl || order.tracking_url || ""}"
            >

            <button onclick="updateTracking('${order.id}')">
              Update Tracking
            </button>
          </div>
        `).join("");
      } catch (error) {
        resultBox.innerHTML = "<p>Something went wrong loading orders.</p>";
      }
    }

    async function updateTracking(orderId) {
      const password = document.getElementById("passwordInput").value.trim();
      const trackingNumber = document.getElementById(`tracking-${orderId}`).value.trim();
      const trackingUrl = document.getElementById(`tracking-url-${orderId}`).value.trim();

      if (!trackingNumber) {
        alert("Please enter a tracking number.");
        return;
      }

      try {
        const res = await fetch("/api/admin/update-tracking", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            password,
            orderId,
            trackingNumber,
            trackingUrl
          })
        });

        const data = await res.json();

        if (data.success) {
          alert("Tracking updated successfully!");
          loadOrders();
        } else {
          alert(data.error || "Tracking update failed.");
        }
      } catch (error) {
        alert("Something went wrong updating tracking.");
      }
    }
  </script>

  <script src="/footer.js"></script>
</body>
</html>
