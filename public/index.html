<!DOCTYPE html>
<html>
<head>
  <title>Kori Sellz</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="hero">
    <div class="logo">Kori Sellz</div>
    <p>Trending tech. Luxury vibes. Everyday prices.</p>

    <a class="track-link" href="track.html">Track Order</a>

    <input id="searchInput" placeholder="Search products..." oninput="renderProducts()">

    <input type="hidden" id="categoryFilter" value="All">

    <div class="category-filter">
      <button class="category-btn active" onclick="setCategory('All', this)">All</button>
      <button class="category-btn" onclick="setCategory('Tech Accessories', this)">Tech Accessories</button>
      <button class="category-btn" onclick="setCategory('Drones & Cameras', this)">Drones & Cameras</button>
      <button class="category-btn" onclick="setCategory('Beauty', this)">Beauty</button>
      <button class="category-btn" onclick="setCategory('Home Security', this)">Home Security</button>
      <button class="category-btn" onclick="setCategory('Creator Tools', this)">Creator Tools</button>
    </div>
  </header>

  <main id="products"></main>

  <button class="cart-float" onclick="toggleCart()">
    🛒 <span id="cartCount">0</span>
  </button>

  <aside id="cartPanel">
    <h2>Your Cart</h2>
    <div id="cartItems"></div>
    <h3 id="cartTotal">$0.00</h3>
    <button onclick="checkout()">Checkout</button>
    <button class="close-btn" onclick="toggleCart()">Close</button>
  </aside>

  <script src="script.js"></script>
</body>
</html>
