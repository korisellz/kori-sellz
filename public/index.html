<!DOCTYPE html>
<html>
<head>
<title>Kori Sellz</title> <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="hero">
  <div class="logo">Kori Sellz</div>
  <p>Trending tech. Luxury vibes. Everyday prices.</p>

    <input id="searchInput" placeholder="Search products..." oninput="renderProducts()">

    <select id="categoryFilter" onchange="renderProducts()">
      <option value="all">All Categories</option>
      <option value="tech">Tech</option>
      <option value="audio">Audio</option>
      <option value="drones">Drones</option>
      <option value="chargers">Chargers</option>
    </select>
  </header>

  <main id="products"></main>

  <button class="cart-float" onclick="toggleCart()">
    🛒 <span id="cartCount">0</span>
  </button>

  <aside id="cartPanel">
    <h2>Your Cart</h2>
    <div id="cartItems"></div>
    <h3 id="cartTotal">$0.00</h3>
    <button onclick="checkout()">Checkout</button>
    <button class="close-btn" onclick="toggleCart()">Close</button>
  </aside>

  <script src="script.js"></script>
</body>
</html>
